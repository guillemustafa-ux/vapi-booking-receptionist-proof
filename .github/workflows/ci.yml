name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # No API key, no Docker, no network beyond npm: Vapi and Stripe are local fakes.
  suite:
    name: "baseline (${{ matrix.os }}, node ${{ matrix.node }}): suite and typecheck must pass"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22.14 is the minimum: the better-sqlite3 13 prebuilt binary needs N-API 10.
        node: ['22.14', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  # The suite is only trustworthy if it BITES. Each footgun reintroduces one real mistake;
  # the runner exits 0 only when exactly the tests documented for it fail.
  footgun-must-be-caught:
    name: "footgun ${{ matrix.footgun }}: exactly its tests must fail"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        footgun:
          - skip-signature-check
          - no-tool-call-ledger
          - no-slot-unique-index
          - no-recall-lookup
          - fresh-stripe-key
          - release-without-asking-stripe
          - cancel-without-expiring
          - no-sweep-budget
          - owner-is-spoken-number
          - no-ownership-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
      - run: npm ci
      - run: npm run footgun ${{ matrix.footgun }}
